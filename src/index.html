<html lang="en-US">
<head>
  <title>Bike Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
</head>
<body>
  <div class="container hidden">
    <h1>Currency Exchanger</h1>
    <p>Enter an amount and currency to see the current exchange rate.</p>
    <form>
      <label for="amount">Enter Amount In USD</label>
      <input id="amount" type="number" name="amount" step="0.01"><br />
      <label for="currency">Enter Currency Type</label>
      <select id="currency" name="currency">
      </select><br />
      <button type="submit" class="btn-success">Get Exchange Rate</button>
    </form>
  </div>
  <p id="output"></p>
</body>
</html>
